<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge 电台</title>  <script type="module" crossorigin src="/assets/assembly-CSjgML0H.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/assembly-Ecb969vh.css">
</head><body>
<main class="assembly-app">
<header><h1><strong>Forge</strong> 电台</h1><span class="connection">本地仿真</span><button id="export-assembly">导出配置</button></header>
<div class="assembly-layout">
<section class="stage-card"><div class="stage-header"><span id="stage-title">3D 视图</span><span id="load-status" role="status">加载中</span></div><div id="assembly-viewport"><div id="assembly-loading">加载模型…</div></div><div class="stage-toolbar"><button id="orbit" aria-pressed="false">自动旋转</button><button id="front">正面</button><button id="side">侧面</button><button id="back">背面</button><button id="fit">适配视角</button><button id="wireframe" aria-pressed="false">线框</button></div></section>
<aside><nav class="tabs" aria-label="调试面板"><button data-tab="motion" class="selected" aria-pressed="true">关节</button><button data-tab="appearance" aria-pressed="false">外观</button><button data-tab="screen" aria-pressed="false">屏幕</button><button data-tab="mount" aria-pressed="false">装配</button><button data-tab="server" aria-pressed="false">Server</button></nav>
<div data-pane="motion"><section class="panel"><h2>关节调试 <span>0–180°</span></h2><div id="joint-controls"></div><details class="firmware-panel" open><summary>固件动作预览</summary><label class="field">动作<select id="firmware-action"></select></label><div class="parameter-grid"><label>周期 ms<input id="firmware-period" type="number" min="500" max="1500" step="10" value="1000"></label><label>次数<input id="firmware-steps" type="number" min="1" max="100" value="3"></label><label>幅度 °<input id="firmware-height" type="number" min="0" max="170" value="30"></label><label>方向<select id="firmware-direction"><option value="1">前进 / 左</option><option value="-1">后退 / 右</option></select></label></div><button id="play-firmware" class="primary">播放动作</button><p id="motion-status" role="status">读取固件角度 · 仅仿真</p><details><summary>角度参数</summary><pre id="motion-spec">选择动作后播放</pre></details></details><div class="action-grid"><button data-action="home" class="selected">站立复位</button><button data-action="walk">行走</button><button data-action="swing">左右摇摆</button><button data-action="turn">转向</button><button data-action="bend">弯曲</button><button id="pause-motion">暂停动作</button></div><label class="range-field"><span>速度<output id="motion-speed-value">1.0×</output></span><input id="motion-speed" aria-label="动作速度" type="range" min="0.3" max="2" value="1" step="0.1"></label><p class="hint">输入角度立即生效；仿真不连接实机。</p></section></div>
<div data-pane="appearance" hidden><section class="panel"><h2>机器人</h2><label class="field">模型<select id="shell"><option value="b">奶蛙机器人</option><option value="a">刘看山机器人</option></select></label><h2>部件颜色</h2><div id="color-controls"></div><div class="palette" id="palette" aria-label="预设色盘"></div><label class="field">色盘应用到<select id="color-target"><option value="shell">外壳</option><option value="body">机身</option><option value="limbs">腿脚</option><option value="all">全部</option></select></label><button id="reset-colors">恢复配色</button></section></div>
<div data-pane="screen" hidden><section class="panel screen-editor"><h2>屏幕调试</h2><label class="field">模式<select id="screen-mode"><option value="gif">GIF 表情</option><option value="js">JavaScript</option></select></label><div id="js-editor" hidden><textarea id="js-code" spellcheck="false" aria-label="JavaScript 屏幕代码"></textarea><div class="js-actions"><button id="js-run" class="primary">运行 / 更新</button><button id="js-stop">停止</button><button id="js-example">示例</button></div><p id="js-status" role="status"></p><details><summary>代码接口</summary><p>Canvas 2D：ctx、width、height、time、delta、state。每帧执行；不需要动画循环，不支持 DOM 或网络。</p></details></div><div id="gif-controls"><label class="field">表情<select id="face-select"><option value="neutral">待机</option><option value="happy">开心</option><option value="laughing">大笑</option><option value="confused">疑惑</option><option value="sleepy">困了</option><option value="angry">生气</option></select></label><label class="field">导入 GIF<input id="face-file" type="file" accept="image/gif"></label><p id="face-status" role="status"></p></div></section></div>
<div data-pane="mount" hidden><section class="panel"><h2>装配</h2><label class="field">查看<select id="inspect"><option value="assembly">完整装配</option><option value="shell">外壳</option><option value="body">机身</option><option value="leg">腿部</option><option value="foot">脚部</option><option value="grip">夹持件</option></select></label><div class="checks"><label><input type="checkbox" id="show-shell" checked>外壳</label><label><input type="checkbox" id="show-body" checked>机身</label><label><input type="checkbox" id="show-screen" checked>屏幕</label><label><input type="checkbox" id="show-grip" checked>夹持件</label><label><input type="checkbox" id="transparent">透视</label><label><input type="checkbox" id="show-axes">关节轴</label></div><label class="range-field"><span>展开<output id="explode-value">0%</output></span><input id="explode" aria-label="装配展开" type="range" min="0" max="1" step="0.01" value="0"></label><div id="assembly-controls"></div><button id="reset-assembly">恢复装配</button><p class="hint">外壳与夹持件位置可微调，非精密配合验证。</p></section></div>
<div data-pane="server" hidden><section class="panel server-console" id="server-console" aria-label="Otto Master Server 控制台"></section></div>
</aside></div></main></body></html>
