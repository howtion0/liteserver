[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "otto-master"
version = "0.4.2"
description = "Cross-platform Python runtime for an Otto robot cluster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "amqtt>=0.12,<0.13",
    "aiosqlite",
    "fastapi",
    "httpx",
    "opuslib-next",
    "pydantic-settings",
    "python-dotenv",
    "PyYAML",
    "uvicorn[standard]",
    "websockets",
    "zeroconf",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]
package = [
    "pyinstaller",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otto_master = ["web/*"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["otto_master"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
