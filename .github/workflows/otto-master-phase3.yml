name: Otto Master Phase 3

on:
  push:
    branches:
      - "test*"
    paths:
      - "otto-master/**"
      - "webui/**"
      - ".github/workflows/otto-master-phase3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12"]

    defaults:
      run:
        working-directory: otto-master

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Rebuild Forge WebUI
        working-directory: webui
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Verify committed WebUI snapshot
        working-directory: .
        run: git diff --exit-code -- otto-master/src/otto_master/web

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: otto-master/uv.lock

      - name: Install locked environment
        run: uv sync --all-extras --locked

      - name: Install native Opus (macOS)
        if: runner.os == 'macOS'
        run: brew install opus

      - name: Install native Opus (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install opus:x64-windows
          $opusBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows\bin"
          if (-not (Test-Path (Join-Path $opusBin "opus.dll"))) {
            throw "vcpkg did not install opus.dll"
          }
          $opusBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate Windows helper scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              throw "PowerShell syntax failed for $($_.Name): $($errors -join '; ')"
            }
          }

      - name: Verify native Opus loader
        run: >-
          uv run python -c
          "from otto_master.audio.opus import OpusParameters, StreamingOpusEncoder;
          assert StreamingOpusEncoder(OpusParameters(16000)).feed(bytes(1920))"

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Mypy
        run: uv run mypy src

      - name: Tests
        run: uv run python tests/packaging/run_pytest_ci.py

      - name: Build embedded broker smoke executable
        run: >-
          uv run pyinstaller --clean --noconfirm --onefile
          --name mqtt-broker-smoke --paths src
          --distpath dist-smoke --workpath build-smoke
          tests/packaging/mqtt_broker_smoke.py

      - name: Run broker smoke executable (macOS)
        if: runner.os == 'macOS'
        run: ./dist-smoke/mqtt-broker-smoke

      - name: Run broker smoke executable (Windows)
        if: runner.os == 'Windows'
        run: ./dist-smoke/mqtt-broker-smoke.exe

      - name: Build packaged WebUI smoke executable
        run: >-
          uv run pyinstaller --clean --noconfirm --onefile
          --name static-assets-smoke --paths src --collect-data otto_master
          --distpath dist-web-smoke --workpath build-web-smoke
          tests/packaging/static_assets_smoke.py

      - name: Run packaged WebUI smoke executable (macOS)
        if: runner.os == 'macOS'
        run: ./dist-web-smoke/static-assets-smoke

      - name: Run packaged WebUI smoke executable (Windows)
        if: runner.os == 'Windows'
        run: ./dist-web-smoke/static-assets-smoke.exe
